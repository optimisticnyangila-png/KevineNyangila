<!-- JAVASCRIPT INITIALIZATION -->
<!-- ============================================ -->
<script>
    // Update showDashboard() to use new account loading
    async function showDashboard() {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('register').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');

        // CHANGED: Use loadPlatformAccounts instead of loadPlatformStatus
        await loadPlatformAccounts();
        await loadDraftPosts();
        await loadScheduledPosts();
    }

    // Update create post button handler
    document.getElementById('create-post-btn').addEventListener('click', async() => {
        const content = document.getElementById('post-content').value;
        const media = document.getElementById('media-upload').files;

        // NEW: Get selected accounts instead of platforms
        const accountCheckboxes = document.querySelectorAll('.account-checkbox:checked');
        const selectedAccountIds = Array.from(accountCheckboxes).map(cb => cb.value);

        if (selectedAccountIds.length === 0) {
            alert('Please select at least one account to publish to.');
            return;
        }

        const method = editingPostId ? 'PUT' : 'POST';
        const url = editingPostId ?
            `${API_BASE}/create-post/${editingPostId}` :
            `${API_BASE}/create-post`;

        let mediaUrls = [];
        if (media.length > 0) {
            for (const file of media) {
                const storageRef = ref(storage, `posts/${Date.now()}_${file.name}`);
                const snapshot = await uploadBytes(storageRef, file);
                const downloadURL = await getDownloadURL(snapshot.ref);
                mediaUrls.push(downloadURL);
            }
        }

        try {
            const response = await apiFetch(url, {
                method,
                body: JSON.stringify({
                    content,
                    mediaUrls,
                    // NEW: Send account IDs as targets
                    targets: selectedAccountIds,
                    // Optional: also send platform names for backward compatibility
                    platforms: Array.from(accountCheckboxes)
                        .map(cb => cb.dataset.platform)
                        .filter((p, i, a) => a.indexOf(p) === i)
                }),
            });

            const data = await response.json();
            if (!response.ok) {
                alert(data.error || 'Unable to save post');
                return;
            }

            if (editingPostId) {
                alert('Post updated successfully.');
            } else {
                lastCreatedPostId = data.postId;
                alert('Post created: ' + data.postId);
            }

            clearEditingMode();
            document.getElementById('media-upload').value = '';
            document.getElementById('post-content').value = '';
            await loadDraftPosts();
        } catch (error) {
            alert(error.message);
        }
    });
</script>
